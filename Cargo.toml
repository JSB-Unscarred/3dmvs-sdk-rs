[workspace]
members = ["mv3d-lp-internal"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/JSB-Unscarred/3dmvs-sdk-rs"
homepage = "https://github.com/JSB-Unscarred/3dmvs-sdk-rs"

[package]
name = "mv3d-lp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Safe Rust wrapper for the Hikrobot 3D MVS laser profiler SDK."
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["3d-vision", "ffi", "hikrobot", "laser-profiler"]
categories = ["api-bindings", "hardware-support"]
publish = false

[lib]
name = "mv3d_lp"
path = "src/lib.rs"

[features]
default = []
native = ["mv3d-lp-internal/native"]
display-windows = [
    "native",
    "dep:raw-window-handle",
    "mv3d-lp-internal/display-windows",
]

[dependencies]
mv3d-lp-internal = { path = "mv3d-lp-internal", version = "=0.1.0", default-features = false }

[target.'cfg(windows)'.dependencies]
raw-window-handle = { version = "0.6.2", optional = true }
