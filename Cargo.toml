[workspace]
members = ["mv3d-lp-sys"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/JSB-Unscarred/3dmvs-sdk-rs"

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# 错误语义统一记录在 docs::architecture，逐函数复制 `# Errors` 只会制造模板文档。
missing_errors_doc = "allow"
must_use_candidate = "allow"
undocumented_unsafe_blocks = "deny"

[package]
name = "mv3d-lp"
description = "Unofficial safe Rust wrapper for the Hikrobot 3DMVS laser profiler SDK (Mv3dLp)."
keywords = ["hikrobot", "hikvision", "3dmvs", "laser-profiler", "3d-vision"]
categories = ["api-bindings", "hardware-support"]
exclude = ["/.gitattributes", "/.gitignore", "/AGENTS.md", "/CLAUDE.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = []

[lints]
workspace = true

[dependencies]
mv3d-lp-sys = { path = "mv3d-lp-sys", version = "0.1.1" }
raw-window-handle = "0.6"
thiserror = "2"
